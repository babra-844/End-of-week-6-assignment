
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpendWise - Budget Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>SpendWise</h1>
        <p>Your Personal Budget Management Dashboard</p>
    </header>

    <main>
        <section class="budget-section">
            <h2>Set Your Budget</h2>

            <form id="budgetForm">
                <label for="budgetInput">Total Budget (KES)</label>
                <input
                    type="number"
                    id="budgetInput"
                    min="0.01"
                    step="0.01"
                    placeholder="Enter your budget"
                    required
                >
                <button type="submit">Set Budget</button>
            </form>
        </section>

        <section class="dashboard">
            <h2>Budget Summary</h2>

            <div class="summary">
                <div class="summary-card">
                    <h3>Total Budget</h3>
                    <p id="totalBudget">KES 0.00</p>
                </div>

                <div class="summary-card">
                    <h3>Total Expenses</h3>
                    <p id="totalExpenses">KES 0.00</p>
                </div>

                <div class="summary-card">
                    <h3>Remaining Balance</h3>
                    <p id="remainingBalance">KES 0.00</p>
                </div>
            </div>

            <p id="budgetMessage" role="status"></p>
        </section>

        <section class="expense-section">
            <h2>Add an Expense</h2>

            <form id="expenseForm">
                <label for="expenseName">Expense Name</label>
                <input
                    type="text"
                    id="expenseName"
                    placeholder="e.g. Transport"
                    required
                >

                <label for="expenseAmount">Expense Amount (KES)</label>
                <input
                    type="number"
                    id="expenseAmount"
                    min="0.01"
                    step="0.01"
                    placeholder="Enter amount"
                    required
                >

                <button type="submit">Add Expense</button>
            </form>
        </section>

        <section class="expense-list">
            <h2>Expense History</h2>

            <ul id="expensesList">
                <li>No expenses added yet.</li>
            </ul>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 SpendWise. Manage your money wisely.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
